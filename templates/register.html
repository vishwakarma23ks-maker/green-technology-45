{% extends "base.html" %}

{% block title %}Register — GreenEdu{% endblock %}

{% block content %}
<main style="max-width:500px;">
    <div style="background:#fff; border-radius:16px; padding:3rem; box-shadow:0 4px 20px rgba(46,125,50,0.1); margin-top:2rem;">
        <div style="text-align:center; margin-bottom:2rem;">
            <div style="font-size:3rem; margin-bottom:0.5rem;">📝</div>
            <h2 style="color:var(--green-dark); font-size:1.75rem;">Create Account</h2>
            <p style="color:#666;">Set up your GreenEdu admin account</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required minlength="3" placeholder="Choose a username">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required minlength="6" placeholder="At least 6 characters">
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" required placeholder="Re-enter password">
            </div>
            <button type="submit" class="hero-btn" style="width:100%; border:none; cursor:pointer; font-size:1rem;">Create Account</button>
        </form>

        <p style="text-align:center; margin-top:1.5rem; color:#666;">
            Already have an account? <a href="{{ url_for('login') }}">Login</a>
        </p>
    </div>
</main>
{% endblock %}
