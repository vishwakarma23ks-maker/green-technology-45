{% extends "admin/admin_base.html" %}

{% block title %}Settings — GreenEdu Admin{% endblock %}

{% block content %}
<div class="welcome-banner">
    <div>
        <h1>⚙️ Settings</h1>
        <p>Manage your profile and system preferences.</p>
    </div>
    <div class="illustration">🔧</div>
</div>

<div class="panel">
    <div class="panel-header">
        <h2>User Profile</h2>
    </div>
    <div style="max-width:500px;">
        <div class="form-group">
            <label>Username</label>
            <input type="text" value="{{ session.get('username', '') }}" readonly style="width:100%; padding:0.6rem; border:1px solid #ddd; border-radius:8px; background:#f5f5f5;">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" value="admin@greenedu.com" readonly style="width:100%; padding:0.6rem; border:1px solid #ddd; border-radius:8px; background:#f5f5f5;">
        </div>
        <div class="form-group">
            <label>Role</label>
            <input type="text" value="{{ session.get('role', 'admin')|capitalize }}" readonly style="width:100%; padding:0.6rem; border:1px solid #ddd; border-radius:8px; background:#f5f5f5;">
        </div>
    </div>
</div>

<div class="panel">
    <div class="panel-header">
        <h2>System Settings</h2>
    </div>
    <div style="max-width:500px;">
        <div class="form-group">
            <label>Site Name</label>
            <input type="text" value="GreenEdu" style="width:100%; padding:0.6rem; border:1px solid #ddd; border-radius:8px;">
        </div>
        <div class="form-group">
            <label>Support Email</label>
            <input type="email" value="support@greenedu.in" style="width:100%; padding:0.6rem; border:1px solid #ddd; border-radius:8px;">
        </div>
        <div class="form-group">
            <label>Support Phone</label>
            <input type="text" value="+91 98765 43210" style="width:100%; padding:0.6rem; border:1px solid #ddd; border-radius:8px;">
        </div>
        <button class="hero-btn" style="border:none; cursor:pointer; margin-top:0.5rem;">Save Settings</button>
    </div>
</div>

<div class="panel">
    <div class="panel-header">
        <h2>Need Help?</h2>
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
        <div style="background:var(--green-soft); padding:1rem; border-radius:10px;">
            <div style="font-size:1.5rem; margin-bottom:0.5rem;">📞</div>
            <strong>+91 98765 43210</strong>
        </div>
        <div style="background:var(--green-soft); padding:1rem; border-radius:10px;">
            <div style="font-size:1.5rem; margin-bottom:0.5rem;">📧</div>
            <strong>support@greenedu.in</strong>
        </div>
    </div>
</div>
{% endblock %}
