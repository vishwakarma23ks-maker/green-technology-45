{% extends "base.html" %}

{% block title %}404 — Page Not Found{% endblock %}

{% block content %}
<main style="text-align:center; padding:5rem 2rem;">
    <div style="font-size:8rem;">🌿</div>
    <h1 style="font-size:6rem; color:var(--green);">404</h1>
    <h2 style="color:var(--green-dark); margin-bottom:1rem;">Page Not Found</h2>
    <p style="color:#666; margin-bottom:2rem;">The page you're looking for doesn't exist.</p>
    <a href="{{ url_for('home') }}" class="hero-btn" style="text-decoration:none;">← Back to Home</a>
</main>
{% endblock %}
